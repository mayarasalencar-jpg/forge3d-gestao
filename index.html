<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge3D Gestão</title><style>
body{margin:0;background:#111;color:#eee;font:16px system-ui}.wrap{max-width:800px;margin:auto;padding:18px}.brand{color:#f70;font-weight:900;font-size:24px}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #555;background:#222;color:#fff}button{background:#f70;color:#111;font-weight:bold}section{background:#1c1c1c;padding:16px;border-radius:12px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:#aaa;font-size:13px}@media(max-width:550px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="brand">⚙ FORGE3D</div><p class="muted">YOU IMAGINE IT WE PRINT</p>
<section id="config"><h2>Conectar ao Supabase</h2><input id="url" placeholder="Project URL"><input id="key" placeholder="Publishable key"><button onclick="connect()">Conectar</button></section>
<section id="login" hidden><h2>Acesso</h2><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Senha"><button onclick="login()">Entrar</button><p class="muted">As contas devem ser criadas no Supabase Authentication.</p></section>
<div id="app" hidden><section><button onclick="logout()">Sair</button><h2>Produtos</h2><div class="grid"><input id="name" placeholder="Nome do produto"><select id="cat"><option>Confeitaria</option><option>Toys</option><option>Enfeites</option><option>Natal</option><option>Chaveiros</option></select><input id="sub" placeholder="Subcategoria"><input id="price" type="number" placeholder="Preço CAD"><input id="grams" type="number" placeholder="Filamento (g)"><input id="hours" type="number" placeholder="Horas de impressão"><input id="extra" type="number" placeholder="Outros custos CAD"><input id="labor" type="number" placeholder="Mão de obra CAD"><input id="photo" type="file" accept="image/*" capture="environment"></div><button onclick="save()">Salvar produto</button><div id="list"></div></section>
<section><h2>Custos e ajustes</h2><div class="grid"><input id="spool" type="number" value="20" placeholder="Preço rolo CAD"><input id="weight" type="number" value="1000" placeholder="Peso rolo g"><input id="wear" type="number" value="1" placeholder="Desgaste por hora CAD"><input id="waste" type="number" value="10" placeholder="Desperdício %"></div><button onclick="saveSettings()">Salvar ajustes</button></section></div><p id="msg" class="muted"></p></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';let db,uid;
window.connect=()=>{let u=document.querySelector('#url').value,k=document.querySelector('#key').value;localStorage.setItem('f3u',u);localStorage.setItem('f3k',k);init(u,k)};
async function init(u,k){db=createClient(u,k);document.querySelector('#config').hidden=true;document.querySelector('#login').hidden=false;let{data}=await db.auth.getSession();if(data.session)ready();db.auth.onAuthStateChange((e,s)=>{if(s)ready()})}
window.login=async()=>{let{error}=await db.auth.signInWithPassword({email:email.value,password:pass.value});msg(error?.message||'Conectado')};
function ready(){document.querySelector('#login').hidden=true;document.querySelector('#app').hidden=false;load()}
window.logout=()=>db.auth.signOut();
const msg=t=>document.querySelector('#msg').textContent=t;
async function load(){let{data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error)return msg(error.message);let out='';for(let p of data)out+=`<section><b>${p.name}</b><p>${p.category} · $${p.price} CAD</p><button onclick="del('${p.id}')">Excluir</button></section>`;document.querySelector('#list').innerHTML=out}
window.save=async()=>{let f=document.querySelector('#photo').files[0],path=null;if(f){path=crypto.randomUUID()+'-'+f.name;let{error}=await db.storage.from('product-photos').upload(path,f);if(error)return msg(error.message)}
let row={name:name.value,category:cat.value,subcategory:sub.value,price:+price.value||0,grams:+grams.value||0,hours:+hours.value||0,extra:+extra.value||0,labor:+labor.value||0,photo_path:path};let{error}=await db.from('products').insert(row);msg(error?.message||'Produto salvo');load()};
window.del=async id=>{let{error}=await db.from('products').delete().eq('id',id);msg(error?.message||'Excluído');load()};
window.saveSettings=async()=>{let row={id:1,spool_price:+spool.value,spool_weight:+weight.value,machine_hourly:+wear.value,waste_pct:+waste.value};let{error}=await db.from('app_settings').upsert(row);msg(error?.message||'Ajustes salvos')};
let u=localStorage.getItem('f3u'),k=localStorage.getItem('f3k');if(u&&k)init(u,k);
</script></body></html>
